name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: matlab
    env:
      MATLAB_CMD: /home/runner/work/_actions/matlab-actions/run-tests/v3/dist/bin/glnxa64/run-matlab-command
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          cache: true
      - uses: matlab-actions/run-tests@v3
        with:
          source-folder: .
          select-by-folder: test
      - uses: actions/setup-go@v6
      - name: Install toml-test v2.1.0
        run: go install github.com/toml-lang/toml-test/v2/cmd/toml-test@v2.1.0
      - name: Warm up MATLAB TOML server
        run: echo 'key = "value"' | ./test/ci.bash "${{ env.MATLAB_CMD }}"
      - name: Run toml-test (containers.Map, skip unicode)
        run: >
          toml-test test
          -toml=1.1
          -decoder="./test/ci.bash ${{ env.MATLAB_CMD }}"
          -parallel=1
          -timeout=10s
      - name: Run toml-test (dictionary, all tests)
        env:
          TOML_USE_DICT: "1"
        run: >
          toml-test test
          -toml=1.1
          -decoder="./test/ci.bash ${{ env.MATLAB_CMD }}"
          -parallel=1
          -timeout=10s

  test-octave:
    runs-on: ubuntu-latest
    name: octave
    steps:
      - uses: actions/checkout@v6
      - name: Install Octave
        run: sudo apt-get update && sudo apt-get install -y octave
      - uses: actions/setup-go@v6
      - name: Install toml-test v2.1.0
        run: go install github.com/toml-lang/toml-test/v2/cmd/toml-test@v2.1.0
      - name: Run toml-test with Octave (containers.Map)
        run: >
          toml-test test
          -toml=1.1
          -decoder="./test/ci_octave.bash"
          -skip="valid/key/dotted-empty"
          -skip="valid/table/empty-name"
          -parallel=1
          -timeout=30s
