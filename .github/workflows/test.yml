name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          cache: true
      - uses: matlab-actions/run-tests@v3
      - uses: watermarkhu/toml-test-action@main
        with:
          command: ./ci.bash /home/runner/work/_actions/matlab-actions/run-tests/v3/dist/bin/glnxa64/run-matlab-command
          skip: "invalid/encoding/bad-utf8-*"
          parallel: 1
